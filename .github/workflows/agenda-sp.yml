
name: Atualizar Agenda Tributaria SP

on:
  schedule:
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      - name: Instalar bibliotecas
        run: python -m pip install requests

      - name: Executar atualizacao
        run: python atualizar_agenda_sp.py


      - name: Salvar alteracoes na agenda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/agenda-sp.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizacao automatica da agenda SP"
            git push
          fi
