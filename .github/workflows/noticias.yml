name: Atualizar noticias oficiais
on:
  push:
    branches: [main]
    paths: [atualizar_noticias.py, .github/workflows/noticias.yml]
  schedule:
    - cron: '13 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noticias-oficiais
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consultar fontes oficiais
        run: python atualizar_noticias.py
      - name: Salvar noticias atualizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/noticias.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza noticias oficiais para pequenos negocios'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
